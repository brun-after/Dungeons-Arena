name: Implantar servidor

# Gera imagens amd64 e arm64 do servidor, publica no GitHub Container Registry e atualiza a VM por SSH.
# Só roda quando a VM estiver configurada (variável ARENA_URL e segredos VM_*; docs/IMPLANTACAO.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: implantar-servidor
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGEM: ghcr.io/${{ github.repository_owner }}/dungeons-arena-servidor

jobs:
  imagem:
    name: Imagem amd64 e arm64
    if: ${{ vars.ARENA_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGEM }}:${{ github.sha }}
            ${{ env.IMAGEM }}:latest

  implantar:
    name: Atualizar a VM
    needs: imagem
    runs-on: ubuntu-latest
    environment: producao
    steps:
      - uses: actions/checkout@v5
      - name: Chave SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/vm
          chmod 600 ~/.ssh/vm
          # 13/10/2026: tenta algumas vezes; uma oscilação de rede (ou troca de IP) derrubou um deploy.
          for i in 1 2 3 4 5; do
            if ssh-keyscan -T 10 -H "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null && [ -s ~/.ssh/known_hosts ]; then exit 0; fi
            echo "ssh-keyscan falhou (tentativa $i); nova tentativa em 10 s" >&2
            sleep 10
          done
          echo "A VM não respondeu ao SSH em $VM_HOST" >&2
          exit 1
      - name: Enviar compose e Caddyfile
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: scp -i ~/.ssh/vm docker-compose.yml Caddyfile "$VM_USER@$VM_HOST:/opt/dungeons-arena/"
      - name: Subir a nova versão
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          DOMINIO: ${{ secrets.DOMINIO }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Marco 17 (D-063): a chave do certificado do personagem (só no GitHub e no .env da VM).
          CHAVE_CERTIFICADO: ${{ secrets.CHAVE_CERTIFICADO }}
          # Marco 29 (D-128): o Mundo grava o personagem no Supabase com a chave de serviço (só no GitHub e no .env).
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ssh -i ~/.ssh/vm "$VM_USER@$VM_HOST" bash -s <<EOF
          set -euo pipefail
          cd /opt/dungeons-arena
          printf 'IMAGEM_SERVIDOR=%s\nDOMINIO=%s\nREGIAO=%s\nCHAVE_CERTIFICADO=%s\nSUPABASE_URL=%s\nSUPABASE_SERVICE_KEY=%s\n' '${{ env.IMAGEM }}:${{ github.sha }}' '$DOMINIO' 'sa-east-1' '$CHAVE_CERTIFICADO' '$SUPABASE_URL' '$SUPABASE_SERVICE_KEY' > .env
          chmod 600 .env
          echo '$TOKEN' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          docker compose --profile producao pull
          docker compose --profile producao up -d --remove-orphans
          docker image prune -f
          EOF
      - name: Conferir /saude
        env:
          DOMINIO: ${{ secrets.DOMINIO }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://$DOMINIO/saude"; then echo; exit 0; fi
            sleep 5
          done
          echo "O servidor não respondeu em https://$DOMINIO/saude" >&2
          exit 1
