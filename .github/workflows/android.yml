name: App Android (APK)

# Marco 20 (21/10/2026, D-087): compila o APK do app (Capacitor).
# Marco 21 (23/10/2026, D-088): com a chave fixa (secrets ANDROID_CHAVE_B64 e ANDROID_CHAVE_SENHA, criados por
# tools/android/criar-chave.sh), o APK sai assinado sempre com a mesma chave e a versão é o número desta execução;
# assim um APK novo instala por cima do antigo e mantém os saves. No push na main, vira uma Release do GitHub
# (`android-vN`, marcada como a mais recente): é dela que o app tira o aviso "Nova versão disponível".
# Em PR, o APK fica só como artefato do workflow. Sem a chave, cai no APK de depuração (não atualiza por cima).

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'index.html'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'index.html'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSAO_APP: ${{ github.run_number }}
      TEM_CHAVE: ${{ secrets.ANDROID_CHAVE_B64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      # O gradle-wrapper.jar veio do modelo do Capacitor: confere que é o oficial antes de executá-lo.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - run: npm ci
      - run: npm run build:android
        env:
          # Os mesmos endereços públicos do GitHub Pages (pages.yml): servidor da arena e nuvem (Supabase).
          VITE_ARENA_URL: ${{ vars.ARENA_URL }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          # O app compara esta versão com a da Release mais recente.
          VITE_VERSAO_APP: ${{ github.run_number }}

      - name: Chave fixa de assinatura
        if: env.TEM_CHAVE == 'true'
        env:
          ANDROID_CHAVE_B64: ${{ secrets.ANDROID_CHAVE_B64 }}
        run: |
          echo "$ANDROID_CHAVE_B64" | base64 -d > "$RUNNER_TEMP/chave.p12"
          echo "ANDROID_CHAVE_ARQUIVO=$RUNNER_TEMP/chave.p12" >> "$GITHUB_ENV"

      - name: APK assinado com a chave fixa
        if: env.TEM_CHAVE == 'true'
        working-directory: android
        env:
          ANDROID_CHAVE_SENHA: ${{ secrets.ANDROID_CHAVE_SENHA }}
        run: |
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../dungeons-arena.apk

      - name: APK de depuração (sem a chave fixa)
        if: env.TEM_CHAVE != 'true'
        working-directory: android
        run: |
          echo "::warning::Sem os secrets ANDROID_CHAVE_*: APK de depuração, que não atualiza por cima do instalado."
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../dungeons-arena.apk

      - name: Apaga a chave do disco
        if: always()
        run: rm -f "$RUNNER_TEMP/chave.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: dungeons-arena-apk
          path: dungeons-arena.apk
          retention-days: 30

      - name: Release (só na main, com a chave fixa)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.TEM_CHAVE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-v${VERSAO_APP}" dungeons-arena.apk \
            --target "${GITHUB_SHA}" --latest \
            --title "App Android 1.0.${VERSAO_APP}" \
            --notes "APK do app Android (versão ${VERSAO_APP}). Instale por cima da versão anterior; os saves ficam."
