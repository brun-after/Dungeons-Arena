name: App Android (APK)

# Marco 20 (21/10/2026, D-087): compila o APK de depuração do app (Capacitor) e o deixa como artefato do workflow.
# Roda em PR que mexe no cliente e quando pedido à mão (Actions -> App Android -> Run workflow). Assinatura de
# loja (keystore) fica para quando houver Play Store; o APK de depuração instala direto no celular.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'index.html'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      # O gradle-wrapper.jar veio do modelo do Capacitor: confere que é o oficial antes de executá-lo.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - run: npm ci
      - run: npm run build:android
        env:
          # Os mesmos endereços públicos do GitHub Pages (pages.yml): servidor da arena e nuvem (Supabase).
          VITE_ARENA_URL: ${{ vars.ARENA_URL }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      - uses: actions/upload-artifact@v4
        with:
          name: dungeons-arena-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
