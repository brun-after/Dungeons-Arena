name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: Typecheck, lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Typecheck (cliente e núcleo sem DOM)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes de unidade e simulação
        run: npm test

      - name: Metas do simulador completo de balanceamento
        run: npm run balancear

      - name: Diagnóstico completo de balanceamento (cinco classes e intervenções)
        run: |
          mkdir -p "$RUNNER_TEMP/balanceamento"
          npm run balancear:diagnostico -- --registrar --json "$RUNNER_TEMP/balanceamento/amostras.json" > "$RUNNER_TEMP/balanceamento/relatorio.log"
          cp docs/BALANCEAMENTO-DIAGNOSTICO.md "$RUNNER_TEMP/balanceamento/relatorio.md"

      - name: Relatórios e amostras do balanceamento
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-balanceamento
          path: ${{ runner.temp }}/balanceamento/
          if-no-files-found: warn
          retention-days: 7

      - name: Build
        run: npm run build

      - name: Servidor empacotado
        run: npm run build:server

  # Marco 32 (31/10/2026): o smoke passou de 20 min num runner só (WebGL por software, 1 worker) e estourava os
  # 30 min do job (no main também, depois do marco 31). Em 3 fatias paralelas, cada uma no seu runner.
  smoke:
    name: Smoke de ponta a ponta (${{ matrix.fatia }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        fatia: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Smoke de ponta a ponta
        run: npx playwright test --shard=${{ matrix.fatia }}/3

      - name: Galeria visual dos combos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: galeria-combos-${{ matrix.fatia }}
          path: test-results/combos-visuais-*/combos-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Relatório do Playwright em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.fatia }}
          path: test-results/
          retention-days: 7

  imagem:
    name: Imagem Docker do servidor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Construir a imagem (sem publicar)
        run: docker build -t dungeons-arena-servidor:ci .
      - name: A imagem sobe e responde /saude
        run: |
          docker run -d --name servidor -p 2567:2567 -e REGIAO=ci dungeons-arena-servidor:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:2567/saude; then echo; exit 0; fi
            sleep 1
          done
          docker logs servidor
          exit 1
