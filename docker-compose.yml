# Stack da arena.
#   Local (seu PC):  docker compose up --build        → ws://localhost:2567
#   Produção (VM):   docker compose --profile producao up -d   (o deploy faz isso sozinho)
# Variáveis (arquivo .env ao lado, criado pelo deploy na VM):
#   IMAGEM_SERVIDOR  imagem publicada no GHCR (padrão: build local)
#   DOMINIO          ex.: seu-nome.duckdns.org (só produção, para o HTTPS automático)
#   REGIAO           mostrada no lobby antes de entrar

services:
  servidor:
    image: ${IMAGEM_SERVIDOR:-dungeons-arena-servidor:local}
    build: .
    environment:
      PORT: '2567'
      REGIAO: ${REGIAO:-local}
      # Marco 16 (D-062): salas por processo e criações por minuto por origem (a VM tem 1 GB).
      MAX_SALAS: ${MAX_SALAS:-6}
      CRIACOES_POR_MINUTO: ${CRIACOES_POR_MINUTO:-6}
      # Marco 17 (D-063): chave do certificado do personagem (vem do .env que o deploy grava; nunca no repositório).
      CHAVE_CERTIFICADO: ${CHAVE_CERTIFICADO:-}
      # Marco 29 (D-128): o personagem do Mundo no Supabase (sem as duas, o Mundo guarda em memória e perde ao reiniciar).
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
    # Marco 16: o servidor não leva a VM junto se algo crescer demais (o Node fica em 512 MB de heap, Dockerfile).
    mem_limit: 700m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    volumes:
      # Relatórios do teste com pessoas (marco 7A, D-044); sobrevive a novos deploys.
      - servidor-dados:/dados
    ports:
      # Só em 127.0.0.1: no PC, para testes locais; na VM, só o Caddy (80/443) fica exposto à internet.
      - '127.0.0.1:2567:2567'
    restart: unless-stopped

  # Armazenamento externo ao processo para os checkpoints da arena (§3.6, marco 9B).
  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-dados:/data
    restart: unless-stopped

  # HTTPS/WSS com certificado automático (Let's Encrypt) para o domínio do DuckDNS.
  caddy:
    image: caddy:2.10-alpine
    profiles: ['producao']
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    environment:
      DOMINIO: ${DOMINIO:-localhost}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-dados:/data
      - caddy-config:/config
    depends_on:
      - servidor
    restart: unless-stopped

volumes:
  servidor-dados:
  redis-dados:
  caddy-dados:
  caddy-config:
